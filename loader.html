<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OSEL Signage</title>
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/images/favicon-16x16.png">
    <link href="./assets/css/osel.css" rel="stylesheet">
  </head>
  <body>
    
    <!-- ===== Page content ===== -->
    <main class="page-body">
        <div class="container-xxl">

            <div class="row">
                <div class="col">
                    <div class="loader">
                        <img src="assets/images/loader-dots.png" class="dot" />
                        <img src="assets/images/loader-circle.png" class="l-circle rotate" />
                    </div>
                </div>

                <div class="col">
                    <div class="loader">
                        <img src="assets/images/loader-dots.png" class="dot blink" />
                        <img src="assets/images/loader-circle.png" class="l-circle"  />
                    </div>
                </div>

                <div class="col">
                    <div class="loader">
                        <img src="assets/images/loader-dots.png" class="dot blink" />
                        <img src="assets/images/loader-circle.png" class="l-circle rotate" />
                    </div>
                </div>

                <div class="col">
                    <div class="loader">
                        <img src="assets/images/loader.png" class="static" />
                        <div class="lds-ripple"><div></div><div></div></div>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <script src="./assets/js/bootstrap.bundle.min.js" ></script>
    <script src="./assets/js/osel.js" ></script>

  </body>
</html>
