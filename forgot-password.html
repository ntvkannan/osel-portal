<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OSEL Signage</title>
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/images/favicon-16x16.png">
    <link href="./assets/css/osel.css" rel="stylesheet">
  </head>
  <body>
    
    <!-- ===== Video Container ===== -->
     <section class="video-container">
        <!-- Video -->
        <video autoplay muted loop class="video-container__video">
            <source src="./assets/videos/Osel_Player_1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
     </section>

     <!-- ===== Form Wrapper ===== -->
     <div class="form-wr">
        
        <!-- Logo -->
        <div class="form-wr__logo">
            <img src="./assets/images/osel-logo.png" alt="OSEL Logo" />
        </div>

        <!-- Login Toggle Thumb Logo -->
        <div class="login-thumb" onclick="showForm('welome-form')">Login</div>

        <!-- Reset Password Form -->
        <div class="form-container active">
            <!-- <div class="alert alert-danger center">
                <p class="px-2 text-center">For single line</p>
                <ul>
                    <li>First line text goes here</li>
                    <li>Second</li>
                    <li>Third</li>
                    <li>Fourth</li>
                </ul>
            </div> -->
            <div class="input-group mb-3">
                <span class="input-group-text">
                    <span class="material-symbols-outlined">lock</span>
                </span>
                <input type="password" class="form-control no_left_bdr no_right_bdr" placeholder="Enter the password">
                <span class="input-group-text">
                    <span class="material-symbols-outlined">visibility</span>
                </span>
            </div>
            <div class="input-group mb-4">
                <span class="input-group-text">
                    <span class="material-symbols-outlined">lock</span>
                </span>
                <input type="password" class="form-control no_left_bdr no_right_bdr" placeholder="Re-Enter the password">
            </div>
            <div class="form-container__row d-grid">
                <button class="btn btn-primary">Reset Password</button>
            </div>
        </div>
    </div>

    <script src="./assets/js/bootstrap.bundle.min.js" ></script>
    <script src="./assets/js/osel.js" ></script>

  </body>
</html>
